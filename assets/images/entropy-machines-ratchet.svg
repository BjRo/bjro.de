<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">Exclusions only go down</title><desc id="desc">Left, illustrative: exclusion lists for Tach and mypy. Every existing violation starts on the list, and a cap that fails the build only moves down, slice by slice. Right: the largest file went from more than 10,000 lines to under 3,000 lines a day and a half later.</desc>
<rect width="960" height="580" fill="#fffdf8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#68685f" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#252521}.label{font-size:23px;font-weight:700}.name{font-size:20px;font-weight:700}.small{font-size:18px;fill:#68685f}.desc{font-size:17px;fill:#68685f}.kicker{font-size:17px;letter-spacing:2px;fill:#b53c2f}.title{font-family:Georgia,serif;font-size:36px}.big{font-family:Georgia,serif;font-size:30px}.redtext{fill:#b53c2f}.inv{fill:#fffdf8}.arrow{fill:none;stroke:#68685f;stroke-width:2;marker-end:url(#arrow)}</style>
<path d="M40 32H920" stroke="#b53c2f" stroke-width="3"/>
<text x="40" y="70" class="kicker" text-anchor="start">THE RATCHET</text>
<text x="40" y="118" class="title" text-anchor="start">Exclusions only go down</text>
<text x="40" y="178" class="label" text-anchor="start">Exclusion lists (Tach, mypy)</text>
<text x="40" y="204" class="desc" text-anchor="start">Illustrative. Every existing violation starts on the list.</text>
<rect x="40" y="227" width="16" height="16" rx="2" fill="#d8d5ca" stroke="#d8d5ca"/>
<text x="64" y="240" class="desc" text-anchor="start">Exclusions</text>
<path d="M170 235H198" stroke="#b53c2f" stroke-width="3"/>
<text x="206" y="240" class="desc" text-anchor="start">Cap: the build fails above it</text>
<rect x="60" y="280" width="56" height="250" rx="3" fill="#d8d5ca" stroke="#d8d5ca"/>
<rect x="144" y="324" width="56" height="206" rx="3" fill="#d8d5ca" stroke="#d8d5ca"/>
<rect x="228" y="368" width="56" height="162" rx="3" fill="#d8d5ca" stroke="#d8d5ca"/>
<rect x="312" y="410" width="56" height="120" rx="3" fill="#d8d5ca" stroke="#d8d5ca"/>
<rect x="396" y="452" width="56" height="78" rx="3" fill="#d8d5ca" stroke="#d8d5ca"/>
<rect x="480" y="494" width="56" height="36" rx="3" fill="#d8d5ca" stroke="#d8d5ca"/>
<path d="M52 274 H130 V318 H214 V362 H298 V404 H382 V446 H466 V488 H544" fill="none" stroke="#b53c2f" stroke-width="3"/>
<path d="M52 530H544" stroke="#68685f" stroke-width="1"/>
<text x="88" y="558" class="desc" text-anchor="middle">Start</text>
<text x="298" y="558" class="desc" text-anchor="middle">slice by slice →</text>
<text x="508" y="558" class="desc" text-anchor="middle">Today</text>
<path d="M580 160V560" stroke="#d8d5ca"/>
<text x="620" y="178" class="label" text-anchor="start">Largest file</text>
<text x="620" y="204" class="desc" text-anchor="start">Lines of code</text>
<rect x="640" y="280" width="110" height="250" rx="3" fill="#d8d5ca" stroke="#d8d5ca"/>
<rect x="790" y="458" width="110" height="72" rx="3" fill="#b53c2f" stroke="#b53c2f"/>
<text x="695" y="268" class="big" text-anchor="middle">10,000+</text>
<text x="845" y="446" class="big redtext" text-anchor="middle">&lt; 3,000</text>
<text x="695" y="558" class="desc" text-anchor="middle">Before</text>
<text x="845" y="558" class="desc" text-anchor="middle">A day and a half later</text>
</svg>
