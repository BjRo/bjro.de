<text x="40" y="460" class="label" text-anchor="start">Retained owner</text>
<text x="40" y="492" class="body" text-anchor="start">Keep scope, decisions and acceptance in one place.</text>
<rect x="40" y="520" width="880" height="108" rx="5" fill="#f0eee5" stroke="#d8d5ca"/>
<text x="62" y="557" class="label" text-anchor="start">One continuing task context</text>
<text x="62" y="592" class="body" text-anchor="start">Delegate when independence, model choice or parallelism earns its cost.</text>
